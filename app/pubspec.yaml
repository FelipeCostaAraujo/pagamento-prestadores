name: diarias
description: "Controle e fechamento de diárias de prestadoras."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  firebase_analytics: ^12.5.0
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^11.0.0
  http: ^1.5.0
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    # Display face — Sora, shipped as a variable font covering 400..800.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    # Text/UI face — Atkinson Hyperlegible, designed by the Braille Institute
    # for maximum letter distinction. Bundled rather than loaded from the
    # Google Fonts CDN so the app renders correctly offline.
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic

# Gera os ícones das duas plataformas a partir de uma única arte quadrada.
# Regenerar depois de trocar a arte:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: "ic_launcher"
  # O ícone adaptativo do Android recorta muito: a zona segura é um círculo de
  # 66dp num canvas de 108dp. O próprio gerador aplica o inset necessário para
  # manter a arte inteira dentro dessa área.
  adaptive_icon_background: "#11675F"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_foreground_inset: 17
  min_sdk_android: 24

  ios: true
  # A App Store recusa ícone com canal alpha; a arte é achatada sobre o teal
  # da marca antes de virar asset.
  remove_alpha_ios: true
  background_color_ios: "#11675F"
