# Production shape: what runs on the VM.
#
# For local development add the override, which republishes Postgres on the
# host so `go run ./cmd/api` can reach it:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db

services:
  db:
    image: postgres:16-alpine
    container_name: diarias-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: diarias
      # Required — compose refuses to start if it is unset, so the VM can never
      # come up with the old hardcoded password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: diarias
      # Brazilian locale/collation for correct pt-BR ordering of names.
      LANG: pt_BR.utf8
    # No host port mapping: reachable only from other containers on the
    # compose network (e.g. the api service), never from the host itself.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diarias -d diarias"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    container_name: diarias-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DIARIAS_DATABASE_URL: postgres://diarias:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/diarias?sslmode=disable
      DIARIAS_ADDR: ":8081"
      # The reverse proxy terminates TLS and forwards here, so the real client
      # address arrives in X-Forwarded-For. Login throttling needs it to tell
      # callers apart — without this every request looks like it came from the
      # proxy. Only safe because nothing but the proxy can reach this port.
      DIARIAS_TRUST_PROXY: "true"
      # Native apps ignore CORS. Set this to the site's origin if a browser
      # build is ever served from one.
      DIARIAS_CORS_ORIGINS: ${DIARIAS_CORS_ORIGINS:-*}
      # Never seed the demo prestadoras into production.
      DIARIAS_SEED: "false"
      # Reminders. The credential is mounted read-only below; without it the
      # API runs exactly as before, just without push.
      DIARIAS_FCM_CREDENTIALS: ${DIARIAS_FCM_CREDENTIALS:-/run/secrets/fcm.json}
      DIARIAS_TIMEZONE: ${DIARIAS_TIMEZONE:-America/Sao_Paulo}
      DIARIAS_PAYMENT_REMINDER_DAY: ${DIARIAS_PAYMENT_REMINDER_DAY:-5}
    volumes:
      # Put the service-account JSON at ./secrets/fcm.json on the VM. The
      # environment above points here by default. Read-only and gitignored: it
      # authorises sending push as your Firebase project.
      - ./secrets:/run/secrets:ro
    ports:
      # Production contract: the host publishes port 7000 and the reverse
      # proxy forwards the public HTTPS endpoint to it. The VM firewall must
      # prevent untrusted clients from reaching this plain-HTTP port directly.
      - "7000:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
